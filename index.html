<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Aniversário Especial 🎁</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #fef9ff 0%, #f0e6ff 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #4a3e56; overflow-x: hidden; }
        .container { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(123, 44, 191, 0.15); max-width: 480px; width: 100%; text-align: center; border: 2px solid #e2d1f9; position: relative; }
        
        /* Formulário de Criação */
        .form-group { text-align: left; margin-bottom: 12px; }
        label { font-weight: bold; font-size: 13px; color: #5a189a; display: block; margin-bottom: 4px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #d8b4fe; border-radius: 10px; font-size: 14px; outline: none; }
        textarea { height: 70px; resize: none; }

        /* Tela do Presente */
        #gift-screen { cursor: pointer; padding: 20px 0; }
        .gift-box { font-size: 80px; animation: pulse 1.5s infinite alternate; margin: 15px 0; display: inline-block; }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
        .tap-hint { font-size: 14px; color: #7b2cbf; font-weight: bold; animation: bounce 1s infinite alternate; }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }

        /* Balões Voadores da Idade */
        .flying-balloon { position: fixed; bottom: -100px; width: 60px; height: 75px; background: radial-gradient(circle at 35% 35%, #ff85a1, #7b2cbf); border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; display: flex; justify-content: center; align-items: center; color: white; font-size: 28px; font-weight: bold; box-shadow: inset -5px -5px 10px rgba(0,0,0,0.15); animation: flyUp 4s cubic-bezier(0.25, 1, 0.5, 1) forwards; z-index: 99; }
        .flying-balloon::after { content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); width: 2px; height: 12px; background-color: #b8a5d1; }
        @keyframes flyUp { 0% { bottom: -100px; opacity: 1; } 100% { bottom: 75%; opacity: 1; } }

        /* Bolo e Velinha */
        .balloons-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px 0; }
        .static-balloon { width: 50px; height: 65px; background: radial-gradient(circle at 35% 35%, #ff85a1, #7b2cbf); border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; display: flex; justify-content: center; align-items: center; color: white; font-size: 22px; font-weight: bold; position: relative; animation: float 3s ease-in-out infinite alternate; }
        .static-balloon:nth-child(even) { background: radial-gradient(circle at 35% 35%, #ffd166, #ff007f); animation-delay: 0.5s; }
        .static-balloon::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 2px; height: 10px; background-color: #b8a5d1; }
        @keyframes float { 0% { transform: translateY(0px); } 100% { transform: translateY(-8px); } }

        .cake-area { margin: 10px 0; }
        .cake-svg { width: 140px; height: 140px; }
        .flame { fill: #ff9e00; transform-origin: center bottom; animation: flicker 0.6s infinite alternate; transition: opacity 0.5s; }
        @keyframes flicker { 0% { transform: scale(1); } 100% { transform: scale(0.9); } }
        .flame.extinguished { opacity: 0 !important; animation: none; }
        .smoke { opacity: 0; fill: #aaa; transition: opacity 1s; }
        .smoke.active { opacity: 0.6; animation: rise 2s forwards; }
        @keyframes rise { 0% { transform: translateY(0); } 100% { transform: translateY(-25px); opacity: 0; } }

        .btn { background: linear-gradient(90deg, #7b2cbf, #9d4edd); color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 25px; cursor: pointer; width: 100%; margin-top: 8px; }
        .mic-btn { background: #e2d1f9; color: #5a189a; border: none; padding: 8px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 8px; font-weight: bold; width: 100%; }

        /* Mensagem Final */
        .secret-message { display: none; background: #f3e8ff; border: 2px dashed #7b2cbf; border-radius: 16px; padding: 15px; margin-top: 15px; text-align: left; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .surprise-box { display: none; margin-top: 12px; background: #ffea00; color: #3c096c; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; text-align: center; }

        /* Confete e Balões Comemorativos */
        .confetti { position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; animation: confettiFall 3s linear forwards; z-index: 100; }
        @keyframes confettiFall { 0% { transform: translateY(-10px); opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }
        .party-balloon { position: fixed; bottom: -80px; width: 35px; height: 45px; border-radius: 50%; pointer-events: none; animation: partyFloat 5s linear forwards; z-index: 98; }
        @keyframes partyFloat { 0% { bottom: -80px; opacity: 1; } 100% { bottom: 110vh; opacity: 0; } }
    </style>
</head>
<body>

<div class="container">

    <!-- TELA 0: PAINEL DE CRIAÇÃO -->
    <div id="creator-screen">
        <h2 style="color: #5a189a; margin-bottom: 15px;">Monte o Cartão 🎁</h2>
        <div class="form-group">
            <label>Nome do Aniversariante:</label>
            <input type="text" id="input-name" placeholder="Ex: Luana Silva">
        </div>
        <div class="form-group">
            <label>Idade (Anos):</label>
            <input type="number" id="input-age" placeholder="Ex: 26">
        </div>
        <div class="form-group">
            <label>Carta / Mensagem:</label>
            <textarea id="input-msg" placeholder="Escreva aqui a mensagem carinhosa..."></textarea>
        </div>
        <div class="form-group">
            <label>Texto da Surpresa (Destaque Amarelo):</label>
            <textarea id="input-surprise" placeholder="Escreva a surpresa ou curiosidade..."></textarea>
        </div>
        <button class="btn" onclick="generateCard()">✨ Gerar Cartão Prontinho</button>
    </div>

    <!-- TELA 1: O PRESENTE -->
    <div id="gift-screen" style="display: none;" onclick="openGift()">
        <h1 id="display-title" style="color: #5a189a; font-size: 22px;">Você recebeu um presente! 🎁</h1>
        <p style="color: #7b2cbf; margin-top: 5px;">Para: <strong id="display-name"></strong></p>
        <div class="gift-box">🎁</div>
        <p class="tap-hint">👇 Toque no presente para abrir!</p>
    </div>

    <!-- TELA 2: BOLO E VELINHA -->
    <div id="cake-screen" style="display: none;">
        <h1 id="cake-title" style="color: #5a189a; font-size: 22px;"></h1>
        <p style="color: #7b2cbf; font-size: 13px; margin-top: 2px;">Faça um pedido e assopre a velinha!</p>

        <div class="balloons-container" id="balloons-holder"></div>

        <div class="cake-area">
            <svg class="cake-svg" viewBox="0 0 200 200">
                <rect x="95" y="40" width="10" height="40" fill="#7b2cbf" rx="2" />
                <path id="candle-flame" class="flame" d="M100 20 C95 30 95 38 100 40 C105 38 105 30 100 20 Z" />
                <circle id="smoke-1" class="smoke" cx="100" cy="30" r="5" />
                <path d="M40 120 L160 120 L160 170 C160 175 155 180 150 180 L50 180 C45 180 40 175 40 170 Z" fill="#ffc6ff" />
                <path d="M40 120 Q50 135 60 120 Q70 135 80 120 Q90 135 100 120 Q110 135 120 120 Q130 135 140 120 Q150 135 160 120 L160 100 L40 100 Z" fill="#ffadad" />
                <circle cx="60" cy="110" r="3" fill="#fdffb6" />
                <circle cx="90" cy="115" r="3" fill="#caffbf" />
                <circle cx="120" cy="108" r="3" fill="#9bf6ff" />
            </svg>
        </div>

        <p style="font-size: 11px; color: #7b2cbf; font-style: italic;">🎙️ Assopre no microfone ou clique no botão!</p>
        <button class="btn" onclick="blowOutCandle()">💨 Assoprar a Velinha!</button>
        <button class="mic-btn" id="mic-toggle" onclick="toggleMicrophone()">🎙️ Ativar Microfone para Assoprar</button>

        <!-- TELA 3: MENSAGEM FINAL -->
        <div class="secret-message" id="secret-message">
            <h3 style="color: #5a189a; margin-bottom: 6px;">💌 Carta Especial:</h3>
            <p id="display-msg" style="line-height: 1.4; color: #3c096c; font-size: 13px;"></p>
            <div class="surprise-box" id="surprise-box">
                🎁 <strong>SURPRESA ESPECIAL:</strong><br>
                <span id="display-surprise"></span>
            </div>
        </div>
    </div>

</div>

<script>
    let cardData = {};
    let isExtinguished = false;

    function generateCard() {
        const name = document.getElementById('input-name').value || 'Aniversariante';
        const age = document.getElementById('input-age').value || '18';
        const msg = document.getElementById('input-msg').value || 'Feliz Aniversário! Que seu dia seja incrível!';
        const surprise = document.getElementById('input-surprise').value || 'Aproveite bastante o seu dia!';

        cardData = { name, age, msg, surprise };

        document.getElementById('creator-screen').style.display = 'none';
        document.getElementById('display-name').innerText = name;
        document.getElementById('gift-screen').style.display = 'block';
    }

    function openGift() {
        const digits = cardData.age.toString().split('');
        
        digits.forEach((digit, index) => {
            setTimeout(() => {
                const pos = 35 + (index * 20);
                createFlyingBalloon(digit, pos + '%');
            }, index * 250);
        });

        setTimeout(() => {
            document.getElementById('gift-screen').style.display = 'none';
            setupCakeScreen();
        }, 2200);
    }

    function createFlyingBalloon(number, leftPos) {
        const balloon = document.createElement('div');
        balloon.className = 'flying-balloon';
        balloon.innerText = number;
        balloon.style.left = leftPos;
        document.body.appendChild(balloon);
        setTimeout(() => balloon.remove(), 4000);
    }

    function setupCakeScreen() {
        const cakeScreen = document.getElementById('cake-screen');
        document.getElementById('cake-title').innerText = `Parabéns, ${cardData.name}! 🎉`;
        
        const balloonsHolder = document.getElementById('balloons-holder');
        balloonsHolder.innerHTML = '';
        cardData.age.toString().split('').forEach(digit => {
            const b = document.createElement('div');
            b.className = 'static-balloon';
            b.innerText = digit;
            balloonsHolder.appendChild(b);
        });

        document.getElementById('display-msg').innerText = cardData.msg;
        document.getElementById('display-surprise').innerText = cardData.surprise;

        cakeScreen.style.display = 'block';
    }

    function blowOutCandle() {
        if (isExtinguished) return;
        isExtinguished = true;

        document.getElementById('candle-flame').classList.add('extinguished');
        document.getElementById('smoke-1').classList.add('active');

        triggerPartyEffects();

        setTimeout(() => {
            document.getElementById('secret-message').style.display = 'block';
            setTimeout(() => {
                document.getElementById('surprise-box').style.display = 'block';
            }, 600);
        }, 500);
    }

    function triggerPartyEffects() {
        const colors = ['#f72585', '#7209b7', '#3f37c9', '#4cc9f0', '#ff007f', '#ffbe0b'];
        for (let i = 0; i < 40; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = Math.random() * 1.5 + 's';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 3500);
        }

        for (let i = 0; i < 12; i++) {
            setTimeout(() => {
                const balloon = document.createElement('div');
                balloon.className = 'party-balloon';
                balloon.style.left = Math.random() * 90 + 'vw';
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.appendChild(balloon);
                setTimeout(() => balloon.remove(), 5000);
            }, i * 200);
        }
    }

    async function toggleMicrophone() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            const microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);

            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            document.getElementById('mic-toggle').innerText = "🎙️ Ouvindo... Assopre agora!";

            function checkVolume() {
                if (isExtinguished) return;
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
                let average = sum / bufferLength;

                if (average > 40) {
                    blowOutCandle();
                    stream.getTracks().forEach(track => track.stop());
                    document.getElementById('mic-toggle').innerText = "✨ Velinha Apagada!";
                } else {
                    requestAnimationFrame(checkVolume);
                }
            }
            checkVolume();
        } catch (err) {
            alert('Não foi possível acessar o microfone. Clique no botão de assoprar!');
        }
    }
</script>

</body>
  </html>
